<!-- @dsCard group="Colors" viewport="700x160" name="Neutrals" subtitle="Page, surface and ink scale" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:140px;font-family:var(--font-sans)">
<div style="flex:1;background:var(--color-ink-900);display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px">#0F1511 ink-900</div>
<div style="flex:1;background:var(--color-taupe-500);display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px">#8B8A81 taupe-500</div>
<div style="flex:1;background:var(--color-stone-200);display:flex;align-items:flex-end;padding:10px;color:var(--text-primary);font-size:12px">#DCDDD8 stone-200</div>
<div style="flex:1;background:var(--color-cream-100);display:flex;align-items:flex-end;padding:10px;color:var(--text-primary);font-size:12px">#E8E7DE cream-100 (surface-muted)</div>
<div style="flex:1;background:var(--color-cream-50);display:flex;align-items:flex-end;padding:10px;color:var(--text-primary);font-size:12px;box-shadow:inset 0 0 0 1px var(--border-default)">#F3F2E9 cream-50 (page)</div>
<div style="flex:1;background:var(--color-white);display:flex;align-items:flex-end;padding:10px;color:var(--text-primary);font-size:12px;box-shadow:inset 0 0 0 1px var(--border-default)">#FFFFFF white (card)</div>
</div>
